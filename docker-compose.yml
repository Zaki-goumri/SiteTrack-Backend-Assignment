x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-sitetrack}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitetrack}
  POSTGRES_DB: ${POSTGRES_DB:-sitetrack}
  API_DB_USER: ${API_DB_USER:-sitetrack_api}
  API_DB_PASSWORD: ${API_DB_PASSWORD:-sitetrack_api}
  API_PORT: "8080"
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
  DB_MAX_CONNS: ${DB_MAX_CONNS:-10}

services:
  postgres:
    image: postgres:17-alpine
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sitetrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitetrack}
      POSTGRES_DB: ${POSTGRES_DB:-sitetrack}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - max_connections=50
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    image: sitetrack-app:local
    command: ["/app/migrate", "up"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: sitetrack-app:local
    command: ["/app/api"]
    environment: *app-env
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
